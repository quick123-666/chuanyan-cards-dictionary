<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>川言 · 四川方言词典</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; min-height: 100%;
    background-color: #d9c089;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(255,240,200,.4), transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(120,80,30,.2), transparent 60%),
      repeating-linear-gradient(45deg, rgba(120,80,30,.05) 0 2px, transparent 2px 6px);
    font-family: "KaiTi", "STKaiti", "楷体", "DFKai-SB", serif;
    color: #3a2410;
  }
  body { min-height: 100vh; }

  /* ===== 顶部导航 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(217, 192, 137, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(92, 61, 46, 0.25);
    padding: 14px 28px;
    display: flex; align-items: center; gap: 18px;
    flex-wrap: wrap;
  }
  .logo {
    background: linear-gradient(180deg, #a03028 0%, #7a221c 100%);
    color: #f5ead0;
    padding: 6px 18px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 4px;
    box-shadow: 0 2px 8px rgba(122,34,28,.35);
    cursor: pointer;
  }
  .brand-sub {
    color: rgba(58, 36, 16, 0.55);
    font-size: 13px;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .search {
    flex: 1; min-width: 200px; max-width: 420px;
    position: relative;
  }
  .search input {
    width: 100%;
    background: rgba(255, 248, 225, 0.6);
    border: 1px solid rgba(92, 61, 46, 0.35);
    border-radius: 20px;
    padding: 9px 16px 9px 38px;
    color: #3a2410;
    font-size: 14px;
    font-family: "Microsoft YaHei", sans-serif;
    outline: none;
    transition: border-color .2s, background .2s;
  }
  .search input::placeholder { color: rgba(58, 36, 16, 0.4); }
  .search input:focus { border-color: rgba(160, 48, 40, 0.6); background: rgba(255,248,225,.95); }
  .search svg {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; fill: rgba(92, 61, 46, 0.65);
  }
  .nav-btns { display: flex; gap: 8px; margin-left: auto; }
  .nav-btn {
    background: rgba(255, 248, 225, 0.4);
    border: 1px solid rgba(92, 61, 46, 0.4);
    color: #5c3d2e;
    padding: 8px 16px;
    border-radius: 18px;
    font-size: 13px;
    cursor: pointer;
    font-family: "Microsoft YaHei", sans-serif;
    transition: all .2s;
  }
  .nav-btn:hover { background: rgba(255, 248, 225, 0.75); }
  .nav-btn.active { background: #5c3d2e; color: #f5ead0; font-weight: bold; }

  /* ===== 字母条 ===== */
  .alpha-bar {
    padding: 10px 28px 0;
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .alpha-chip {
    background: rgba(255, 248, 225, 0.45);
    border: 1px solid rgba(92, 61, 46, 0.3);
    color: rgba(58, 36, 16, 0.65);
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    cursor: pointer;
    font-family: "Microsoft YaHei", sans-serif;
    transition: all .15s;
  }
  .alpha-chip:hover { color: #a03028; border-color: rgba(160, 48, 40, 0.5); }
  .alpha-chip.active { background: #a03028; color: #f5ead0; font-weight: bold; }

  /* ===== 视图 ===== */
  .view { display: none; }
  .view.active { display: block; }

  .stage {
    width: 100%; min-height: calc(100vh - 130px);
    display: flex; align-items: center; justify-content: center;
    padding: 30px 20px 50px;
    position: relative;
  }
  .card {
    position: relative;
    width: min(1100px, 92vw);
    aspect-ratio: 16 / 9;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255, 245, 215, 0.7), transparent 60%),
      linear-gradient(160deg, #f5ead0 0%, #ecdcba 60%, #e2cfa3 100%);
    border-radius: 24px;
    border: 1px solid rgba(92, 61, 46, 0.4);
    box-shadow: 0 20px 50px rgba(92, 61, 46, 0.35), inset 0 0 60px rgba(120, 80, 30, 0.12);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 4% 8%;
    text-align: center;
    transition: opacity .3s ease, transform .3s ease;
  }
  .card.fade { opacity: 0; transform: translateY(10px); }
  .word {
    font-size: clamp(44px, 7.5vw, 88px);
    color: #5c3d2e;
    letter-spacing: 12px;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(92, 61, 46, 0.18);
    line-height: 1.1;
  }
  .pinyin {
    margin-top: 10px;
    font-size: clamp(18px, 2.2vw, 28px);
    color: #8b6b4a;
    font-style: italic;
    letter-spacing: 6px;
    font-family: "Times New Roman", "STKaiti", serif;
  }
  .pos-tag {
    margin-top: 8px;
    font-size: 13px;
    color: rgba(160, 48, 40, 0.8);
    border: 1px solid rgba(160, 48, 40, 0.4);
    padding: 2px 10px;
    border-radius: 10px;
    font-family: "Microsoft YaHei", sans-serif;
    letter-spacing: 2px;
  }
  .divider {
    width: 120px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(92, 61, 46, 0.5), transparent);
    margin: 20px 0 24px;
  }
  .def {
    font-size: clamp(22px, 3.2vw, 40px);
    color: #2c1810;
    letter-spacing: 3px;
    line-height: 1.4;
  }
  .example {
    margin-top: 20px;
    font-size: clamp(18px, 2.4vw, 30px);
    color: #a03028;
    letter-spacing: 3px;
    line-height: 1.5;
  }
  .translate {
    margin-top: 10px;
    font-size: clamp(14px, 1.6vw, 20px);
    color: rgba(92, 61, 46, 0.55);
    letter-spacing: 2px;
    line-height: 1.4;
  }
  .foot {
    position: absolute;
    bottom: 5%; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 20px;
    font-size: clamp(13px, 1.3vw, 17px);
    color: rgba(92, 61, 46, 0.75);
    letter-spacing: 6px;
  }
  .foot .sep { width: 1px; height: 14px; background: rgba(92, 61, 46, 0.4); }

  /* 翻页按钮 */
  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255, 248, 225, 0.55);
    border: 1px solid rgba(92, 61, 46, 0.4);
    color: #5c3d2e;
    width: 48px; height: 48px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    z-index: 5;
    transition: all .2s;
  }
  .nav-arrow:hover { background: rgba(255, 248, 225, 0.9); }
  .nav-arrow.prev { left: 12px; }
  .nav-arrow.next { right: 12px; }

  /* 卡片左上：录音 / 播放按钮 */
  .audio-bar {
    position: absolute; top: 18px; left: 22px;
    display: flex; gap: 10px; z-index: 6;
    width: 300px;
  }
  .audio-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255, 248, 225, 0.6);
    border: 1px solid rgba(92, 61, 46, 0.4);
    color: #5c3d2e;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .2s;
  }
  .audio-btn:hover { background: rgba(255, 248, 225, 0.95); color: #a03028; }
  .audio-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .audio-btn.recording {
    background: #a03028; color: #f5ead0;
    border-color: #a03028;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(160, 48, 40, 0.5); }
    50% { box-shadow: 0 0 0 10px rgba(160, 48, 40, 0); }
  }
  .audio-btn.has-rec { position: relative; }
  .audio-btn.has-rec::after {
    content: ""; position: absolute; top: 4px; right: 4px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #a03028;
  }

  /* 迷你音频条（有录音时显示，每段一行） */
  .audio-widget {
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 0 4px;
    flex: 1;
  }
  .audio-widget.show { display: flex; }
  .seg-item {
    display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 12px;
    background: rgba(255, 248, 225, 0.6);
    border: 1px solid rgba(92, 61, 46, 0.4);
    border-radius: 20px;
  }
  .seg-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(92,61,46,0.2);
    color: #5c3d2e; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", sans-serif;
    flex-shrink: 0;
  }
  .seg-play {
    width: 28px; height: 28px; border-radius: 50%;
    background: #a03028; color: #f5ead0;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .seg-play-icon { width: 12px; height: 12px; fill: #f5ead0; }
  .seg-time {
    font-size: 12px; color: #5c3d2e;
    font-family: "Microsoft YaHei", sans-serif;
    min-width: 36px; text-align: center;
    flex-shrink: 0;
  }
  .seg-track {
    flex: 1; height: 8px;
    background: rgba(92, 61, 46, 0.35);
    border-radius: 4px;
    position: relative; cursor: pointer;
    overflow: hidden;
  }
  .seg-progress {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0%; background: #a03028;
    border-radius: 3px;
  }
  .seg-del {
    background: none; border: none;
    color: rgba(92, 61, 46, 0.5);
    cursor: pointer; font-size: 16px;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .seg-del:hover { color: #a03028; }
  .audio-tip {
    position: absolute; top: 64px; left: 22px;
    background: rgba(44, 24, 16, 0.9);
    color: #f5ead0;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-family: "Microsoft YaHei", sans-serif;
    white-space: nowrap;
    opacity: 0; transition: opacity .2s;
    pointer-events: none;
  }
  .audio-tip.show { opacity: 1; }

  /* 列表卡片上的播放按钮（有录音时显示） */
  .wc-play {
    position: absolute; top: 12px; right: 12px;
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(180deg, #a03028 0%, #7a221c 100%);
    color: #f5ead0; border: none; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(122,34,28,.35);
    transition: all .2s;
  }
  .wc-play.show { display: flex; }
  .wc-play:hover { transform: scale(1.1); }
  .wc-play svg { width: 12px; height: 12px; fill: #f5ead0; margin-left: 1px; }
  .wc-seg-count {
    position: absolute; top: 14px; right: 48px;
    font-size: 11px; color: #a03028;
    background: rgba(255,248,225,0.8);
    padding: 1px 6px; border-radius: 8px;
    font-family: "Microsoft YaHei", sans-serif;
  }

  /* ===== 列表视图 ===== */
  .list-wrap { padding: 24px 28px 60px; width: 100%; box-sizing: border-box; }
  .list-count {
    color: rgba(58, 36, 16, 0.6);
    font-size: 13px;
    margin-bottom: 16px;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .word-card {
    position: relative;
    background: linear-gradient(160deg, #f5ead0 0%, #ecdcba 100%);
    border: 1px solid rgba(92, 61, 46, 0.3);
    border-radius: 14px;
    padding: 20px 22px;
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 4px 12px rgba(92, 61, 46, 0.15);
  }
  .word-card:hover {
    border-color: rgba(160, 48, 40, 0.55);
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(92, 61, 46, 0.28);
  }
  .word-card.active {
    border-color: rgba(160, 48, 40, 0.8);
    border-width: 2px;
    background: linear-gradient(160deg, #f0dcb0 0%, #e8d0a0 100%);
  }
  .word-card .wc-word {
    font-size: 26px; color: #5c3d2e; letter-spacing: 4px;
    font-weight: bold; margin-bottom: 4px;
  }
  .word-card .wc-py {
    font-size: 14px; color: #8b6b4a; font-style: italic;
    letter-spacing: 2px; font-family: "Times New Roman", serif;
    margin-bottom: 10px;
  }
  .word-card .wc-def {
    font-size: 14px; color: rgba(44, 24, 16, 0.82);
    line-height: 1.5; font-family: "Microsoft YaHei", sans-serif;
  }
  .empty {
    text-align: center; padding: 80px 20px;
    color: rgba(58, 36, 16, 0.45); font-size: 16px;
    font-family: "Microsoft YaHei", sans-serif;
  }

  @media (max-width: 640px) {
    .topbar { padding: 10px 14px; gap: 10px; }
    .brand-sub { display: none; }
    .grid { grid-template-columns: 1fr; }
    .word { letter-spacing: 6px; }
  }
</style>
</head>

<!-- ===== 顶部导航 ===== -->
<div class="topbar">
  <div class="logo" onclick="goCard(0)">川言</div>

  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>

        <div class="audio-widget" id="audioWidget"></div>

        <span>四川方言词典</span>
      </div>
    </div>
    <button class="nav-arrow next" onclick="go(1)">›</button>
  </div>
</div>

<!-- ===== 列表视图 ===== -->
<div class="view" id="view-list">
  <div class="list-wrap">
    <div class="list-count" id="listCount"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">没有匹配的词条</div>
  </div>
</div>

// ===== 状态 =====
let idx = 0;
let currentView = "card";
let activeAlpha = "ALL";
let searchQ = "";

// ===== 视图切换 =====
function setView(v) {
  currentView = v;
  document.querySelectorAll(".view").forEach(el => el.classList.remove("active"));
  document.getElementById("view-" + v).classList.add("active");
  document.getElementById("viewCardBtn").classList.toggle("active", v === "card");
  document.getElementById("viewListBtn").classList.toggle("active", v === "list");
  document.getElementById("alphaBar").style.display = v === "list" ? "flex" : "none";
  if (v === "list") {
    renderList();
    // 滚动到当前卡片对应的列表项
    setTimeout(() => {
      const active = document.querySelector(".word-card.active");
      if (active) active.scrollIntoView({behavior: "smooth", block: "center"});
    }, 100);
  }
}

// ===== 卡片渲染 =====
function render() {
  const c = WORDS[idx];
  document.getElementById("word").textContent = c.word.split("").join(" ");
  document.getElementById("pinyin").textContent = c.pinyin;
  document.getElementById("posTag").textContent = c.pos;
  document.getElementById("def").textContent = c.def;
  document.getElementById("example").textContent = c.example;
  document.getElementById("translate").textContent = c.translate;
  document.getElementById("issue").textContent = c.issue;
  curSeg = 0;  // 切词条时重置段索引
  refreshRecBtn();
}

function go(d) {
  const card = document.getElementById("card");
  card.classList.add("fade");
  setTimeout(() => {
    idx = (idx + d + WORDS.length) % WORDS.length;
    render();
    card.classList.remove("fade");
  }, 200);
}
function goCard(i) {
  setView("card");
  idx = i;
  render();
}

// ===== 字母条 =====
function buildAlphaBar() {
  const letters = ["ALL", ...new Set(WORDS.map(w => w.first))].sort();
  const bar = document.getElementById("alphaBar");
  bar.innerHTML = letters.map(l =>
    `<div class="alpha-chip ${l===activeAlpha?'active':''}" onclick="setAlpha('${l}')">${l}</div>`
  ).join("");
}
function setAlpha(l) {
  activeAlpha = l;
  buildAlphaBar();
  renderList();
}

// ===== 列表渲染（语义搜索：匹配 词面/拼音/释义/关键词标签）=====
function getFiltered() {
  return WORDS.filter(w => {
    if (activeAlpha !== "ALL" && w.first !== activeAlpha) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      const haystack = (w.word + " " + w.pinyin + " " + w.def + " " + w.keywords).toLowerCase();
      return haystack.includes(q);
    }
    return true;
  });
}
function renderList() {
  buildAlphaBar();
  const list = getFiltered();
  document.getElementById("listCount").textContent = `共 ${list.length} 条`;
  const grid = document.getElementById("grid");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  grid.innerHTML = list.map(w => {
    const realIdx = WORDS.indexOf(w);
    const isActive = realIdx === idx;
    const segs = recMap[w.id] || [];
    const hasRec = segs.length > 0;
    return `<div class="word-card ${isActive?'active':''}" onclick="goCard(${realIdx})">
      <button class="wc-play ${hasRec?'show':''}" onclick="event.stopPropagation(); playRec(${w.id})">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      ${segs.length > 1 ? `<span class="wc-seg-count">${segs.length}段</span>` : ''}
      <div class="wc-word">${w.word}</div>
      <div class="wc-py">${w.pinyin} · ${w.pos}</div>
      <div class="wc-def">${w.def.replace("释义：","")}</div>
    </div>`;
  }).join("");
}

// 列表里点击播放录音（播第一段）
function playRec(wordId) {
  const segs = recMap[wordId] || [];
  if (segs.length === 0) return;
  if (widgetAudio) { widgetAudio.pause(); widgetAudio = null; }
  widgetAudio = new Audio(segs[0].url);
  widgetAudio.play();
}

// ===== 搜索 =====
document.getElementById("searchInput").addEventListener("input", e => {
  searchQ = e.target.value.trim();
  if (currentView !== "list") setView("list");
  else renderList();
});

// ===== 键盘 =====
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (currentView === "card") {
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  }
  // R 键：后台录音开关（界面无按钮）
  if (e.key === "r" || e.key === "R") {
    toggleRec();
  }
});

// ===== 发音 / 录音 =====
const recMap = {};   // wordId -> { url, blob }
let mediaRecorder = null;
let recChunks = [];
let recStream = null;

// ===== IndexedDB 持久化录音 =====
let db = null;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("chuanyan_audio", 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("recordings")) {
        d.createObjectStore("recordings", { keyPath: "wordId" });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
}
async function dbPut(wordId, index, blob) {
  if (!db) return;
  return new Promise(resolve => {
    const tx = db.transaction("recordings", "readwrite");
    tx.objectStore("recordings").put({ wordId, index, blob });
    tx.oncomplete = resolve;
  });
}
async function dbDel(wordId) {
  if (!db) return;
  return new Promise(resolve => {
    const tx = db.transaction("recordings", "readwrite");
    const store = tx.objectStore("recordings");
    const req = store.openCursor();
    req.onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) {
        if (cursor.value.wordId === wordId) cursor.delete();
        cursor.continue();
      } else resolve();
    };
  });
}
async function dbLoadAll() {
  if (!db) return;
  return new Promise(resolve => {
    const tx = db.transaction("recordings", "readonly");
    const req = tx.objectStore("recordings").getAll();
    req.onsuccess = () => {
      (req.result || []).forEach(r => {
        if (!recMap[r.wordId]) recMap[r.wordId] = [];
        recMap[r.wordId].push({ blob: r.blob, url: URL.createObjectURL(r.blob) });
      });
      // 按index排序
      Object.keys(recMap).forEach(id => {
        recMap[id].sort((a,b) => (a.index||0) - (b.index||0));
      });
      resolve();
    };
  });
}

function showTip(msg) {
  const t = document.getElementById("audioTip");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showTip._timer);
  showTip._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

// 播放：有真人录音就播录音，否则用浏览器 TTS
function playWord() {
  const c = WORDS[idx];
  const segs = recMap[c.id] || [];
  if (segs.length > 0) {
    const audio = new Audio(segs[0].url);
    audio.play();
    return;
  }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(c.word);
    u.lang = "zh-CN";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch(e) {
    showTip("当前浏览器不支持语音播放");
  }
}

// 录音按钮：未录→开始录；录中→停止保存；已录→追加新一段
async function toggleRec() {
  const c = WORDS[idx];
  const btn = document.getElementById("recBtn");

  // 正在录音 → 停止
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    return;
  }

  // 检查是否已满5段
  const segs = recMap[c.id] || [];
  if (segs.length >= 5) {
    showTip("最多录5段，请先删除一段");
    return;
  }

  // 开始录
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(recStream);
    recChunks = [];
    mediaRecorder.ondataavailable = e => recChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(recChunks, { type: "audio/webm" });
      const url = URL.createObjectURL(blob);
      if (!recMap[c.id]) recMap[c.id] = [];
      const idx = recMap[c.id].length;
      recMap[c.id].push({ url, blob, index: idx });
      btn.classList.remove("recording");
      btn.classList.add("has-rec");
      // 停止麦克风
      recStream.getTracks().forEach(t => t.stop());
      // 写入 IndexedDB
      dbPut(c.id, idx, blob);
      showTip(`已录第${idx+1}段（共${recMap[c.id].length}段）`);
      // 刷新迷你条并自动回放
      curSeg = idx;
      refreshRecBtn();
      if (widgetAudio) widgetAudio.play();
    };
    mediaRecorder.start();
    btn.classList.add("recording");
    showTip("正在录音…再点一次结束");
  } catch(e) {
    showTip("无法访问麦克风（需 HTTPS 或 localhost 环境）");
  }
}

// 切词条时刷新录音按钮状态
let widgetAudio = null;
let curSeg = 0;
function refreshRecBtn() {
  const c = WORDS[idx];
  const btn = document.getElementById("recBtn");
  const widget = document.getElementById("audioWidget");
  const segs = recMap[c.id] || [];
  btn.classList.toggle("has-rec", segs.length > 0);

  if (segs.length > 0) {
    widget.classList.add("show");
    widget.innerHTML = segs.map((seg, i) => `
      <div class="seg-item" data-seg="${i}">
        <span class="seg-num">${i+1}</span>
        <button class="seg-play" onclick="toggleSegPlay(${i})">
          <svg class="seg-play-icon" data-seg="${i}" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="seg-track" data-seg="${i}" onclick="seekSeg(event, ${i})">
          <div class="seg-progress" data-seg="${i}"></div>
        </div>
        <span class="seg-time" data-seg="${i}">0:00</span>
        <button class="seg-del" title="删除本段" onclick="deleteSeg(${i})">✕</button>
      </div>
    `).join("");
    // 自动加载第一段
    loadSegAudio(0);
  } else {
    widget.classList.remove("show");
    widget.innerHTML = "";
    curSeg = 0;
  }
}

function loadSegAudio(i) {
  const c = WORDS[idx];
  const segs = recMap[c.id] || [];
  if (!segs[i]) return;
  if (widgetAudio) { widgetAudio.pause(); widgetAudio = null; }
  widgetAudio = new Audio(segs[i].url);
  curSeg = i;
  const timeEl = document.querySelector(`.seg-time[data-seg="${i}"]`);
  widgetAudio.addEventListener("loadedmetadata", () => {
    if (timeEl) timeEl.textContent =
      Math.floor(widgetAudio.duration / 60) + ":" +
      String(Math.floor(widgetAudio.duration % 60)).padStart(2, "0");
  });
  widgetAudio.addEventListener("timeupdate", () => {
    const bar = document.querySelector(`.seg-progress[data-seg="${i}"]`);
    if (bar) {
      const pct = (widgetAudio.currentTime / widgetAudio.duration * 100) || 0;
      bar.style.width = pct + "%";
    }
  });
  widgetAudio.addEventListener("ended", () => {
    const icon = document.querySelector(`.seg-play-icon[data-seg="${i}"]`);
    if (icon) icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    const bar = document.querySelector(`.seg-progress[data-seg="${i}"]`);
    if (bar) bar.style.width = "0%";
  });
}

function seekSeg(e, i) {
  if (!widgetAudio || curSeg !== i || !widgetAudio.duration) return;
  const track = e.currentTarget;
  const rect = track.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  widgetAudio.currentTime = pct * widgetAudio.duration;
}

function toggleSegPlay(i) {
  const c = WORDS[idx];
  const segs = recMap[c.id] || [];
  if (!segs[i]) return;
  // 不是当前段，先加载
  if (curSeg !== i) {
    loadSegAudio(i);
    widgetAudio.play();
    document.querySelector(`.seg-play-icon[data-seg="${i}"]`).innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    return;
  }
  if (widgetAudio.paused) {
    widgetAudio.play();
    document.querySelector(`.seg-play-icon[data-seg="${i}"]`).innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  } else {
    widgetAudio.pause();
    document.querySelector(`.seg-play-icon[data-seg="${i}"]`).innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

function deleteSeg(i) {
  const c = WORDS[idx];
  const segs = recMap[c.id] || [];
  if (!segs[i]) return;
  if (widgetAudio) { widgetAudio.pause(); widgetAudio = null; }
  URL.revokeObjectURL(segs[i].url);
  segs.splice(i, 1);
  if (segs.length === 0) delete recMap[c.id];
  // 重存IndexedDB
  dbDel(c.id).then(() => {
    if (recMap[c.id]) recMap[c.id].forEach((s, j) => dbPut(c.id, j, s.blob));
  });
  curSeg = 0;
  refreshRecBtn();
  showTip("已删除本段");
}

// 初始化
(async () => {
  try {
    db = await openDB();
    await dbLoadAll();
  } catch(e) {}
  render();
  document.getElementById("viewCardBtn").classList.add("active");
  buildAlphaBar();
})();
</script>
</body>
</html>
